name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
    # Now, every time you push to learn/widgets, the CD runs immediately. You don't have to create a Pull Request or Merge to see if it works
      # - learn/widgets
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # MUST BE BEFORE BUILD: Create the secret file
      - name: Create .env file
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" > .env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env
          echo "FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
          echo "APP_ID=${{ secrets.APP_ID }}" >> .env
          echo "MESSAGING_SENDER_ID=${{ secrets.MESSAGING_SENDER_ID }}" >> .env
          echo "PROJECT_ID=${{ secrets.PROJECT_ID }}" >> .env
      # FIX: Create the missing firebase_options.dart file so the build doesn't crash
      - name: Create firebase_options.dart
        run: |
          cat <<EOF > lib/firebase_options.dart
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, kIsWeb, TargetPlatform;
          import 'env/env.dart';

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => web;

            static FirebaseOptions web = FirebaseOptions(
              apiKey: Env.firebaseApiKey,
              appId: Env.firebaseAppId,
              messagingSenderId: Env.messagingSenderId,
              projectId: Env.projectId,
              authDomain: '${{ secrets.AUTH_DOMAIN }}',
              storageBucket: '${{ secrets.STORAGE_BUCKET }}',
              measurementId: '${{ secrets.MEASUREMENT_ID }}',
            );
          }
          EOF
      # MUST BE BEFORE BUILD: Generate the Envied code
      - name: Generate Envied code
        run: dart run build_runner build --delete-conflicting-outputs

      # THE BUILD COMMAND: Optimized for GitHub Pages
      - name: Build Flutter web
        run: flutter build web --release --base-href /flutter_first_app/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web