name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - learn/widgets # Triggers the workflow on push to the learn\widgets branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release --base-href /flutter_first_app/ --web-renderer html
        # run: flutter build web --release --base-href /flutter_first_app/ # Add your repo name here

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web 

      - name: Create .env file
        run: echo "API_KEY=${{ secrets.API_KEY }}" > .env

      - name: Generate Envied code
        run: dart run build_runner build --delete-conflicting-outputs
