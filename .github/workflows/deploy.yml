name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - learn\widgets # Triggers the workflow on push to the learn\widgets branch

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release --base-href /flutter_first_app/ # Add your repo name here

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web # Directory containing the build output
          # Optional: Use cname if you have a custom domain
          # cname: example.com
